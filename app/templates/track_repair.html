<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Repairs - RoadCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='track_repair.css') }}">
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center mb-4">Welcome to RoadCare - Track Repairs</h2>
        <p class="text-center text-muted">Easily track ongoing and completed road repair tasks in your area. Use the search and filter options below to find specific repairs.</p>
        
        <!-- Search and Filter Section -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card search-card">
                    <div class="card-body">
                        <form class="row g-3" id="search-form">
                            <div class="col-md-4">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                                    <input type="text" id="search-input" class="form-control" placeholder="Search by location or ID">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <input type="text" id="user-id-filter" class="form-control" placeholder="Filter by User ID">
                            </div>
                            <div class="col-md-3">
                                <select id="status-filter" class="form-select">
                                    <option value="">Filter by Status</option>
                                    <option value="pending">Pending</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>
                            <div class="col-md-2 d-flex align-items-center">
                                <button type="submit" class="btn btn-primary w-100">Search</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Repair Status List -->
        <div id="repair-list" class="mt-4">
            <!-- Dynamic content will be injected here -->
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1">Previous</a>
                </li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchRepairs() {
            try {
                const response = await fetch("{{url_for('repairs')}}"); // Replace with actual API endpoint
                const repairs = await response.json();
                displayRepairs(repairs);
            } catch (error) {
                console.error("Error fetching repair data:", error);
            }
        }

        function displayRepairs(repairs, filterText = "", filterStatus = "", filterUserId = "") {
            const list = document.getElementById("repair-list");
            list.innerHTML = "";

            const filteredRepairs = repairs.filter(repair => 
                (filterText === "" || repair.location.toLowerCase().includes(filterText.toLowerCase()) || repair.id.toLowerCase().includes(filterText.toLowerCase())) &&
                (filterStatus === "" || repair.status === filterStatus) &&
                (filterUserId === "" || repair.user_id.toLowerCase().includes(filterUserId.toLowerCase()))
            );

            if (filteredRepairs.length === 0) {
                list.innerHTML = '<p class="text-center text-muted">No repair tasks available. Try adjusting your search filters.</p>';
                return;
            }

            filteredRepairs.forEach(repair => {
                const card = document.createElement("div");
                card.className = "card mb-3";
                card.innerHTML = `
                    <div class="card-body">
                        <h5 class="card-title">Repair ID: ${repair.id}</h5>
                        <p class="card-text">Location: ${repair.location}</p>
                        <p class="card-text"><strong>User ID:</strong> ${repair.user_id}</p>
                        <p class="card-text"><strong>Status:</strong> ${repair.status.replace("_", " ").toUpperCase()}</p>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        document.getElementById("search-form").addEventListener("submit", function(event) {
            event.preventDefault();
            const searchText = document.getElementById("search-input").value;
            const filterStatus = document.getElementById("status-filter").value;
            const filterUserId = document.getElementById("user-id-filter").value;
            fetch("{{url_for('repairs')}}") // Replace with actual API endpoint
                .then(response => response.json())
                .then(repairs => displayRepairs(repairs, searchText, filterStatus, filterUserId))
                .catch(error => console.error("Error filtering repair data:", error));
        });

        window.onload = fetchRepairs;
    </script>
</body>
</html>
